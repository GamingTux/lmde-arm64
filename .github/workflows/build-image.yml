name: Build Raspberry Pi 5 LMDE 7 ARM64 Btrfs Image (pi-gen)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (leer lassen für automatisches Datum vYYYY.MM.DD)'
        required: false
        default: ''
  schedule:
    # Automatisch jeden 1. des Monats um 06:00 UTC ein frisches Image bauen
    - cron: '0 6 1 * *'

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
      options: --privileged -v /dev:/dev -v /lib/modules:/lib/modules:ro
    defaults:
      run:
        shell: bash
    steps:
      - name: Install pi-gen & Btrfs build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            quilt \
            parted \
            coreutils \
            qemu-user-binfmt \
            debootstrap \
            zerofree \
            zip \
            dosfstools \
            e2fsprogs \
            btrfs-progs \
            libcap2-bin \
            grep \
            rsync \
            xz-utils \
            curl \
            ca-certificates \
            xxd \
            file \
            git \
            kmod \
            bc \
            gpg \
            pigz \
            arch-test \
            fdisk \
            mount \
            util-linux \
            python3 \
            debian-archive-keyring \
            gh

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare loop devices & binfmt
        run: |
          git config --global --add safe.directory '*'
          modprobe loop || true
          modprobe btrfs || true
          for i in $(seq 0 15); do
            mknod -m 660 "/dev/loop${i}" b 7 "${i}" 2>/dev/null || true
          done

      - name: Run pi-gen image build
        run: |
          cd "${GITHUB_WORKSPACE}/pi-gen"
          chmod +x build.sh build-docker.sh
          find stage* export-image -name "*.sh" -exec chmod +x {} +

          ./build.sh &
          PIGEN_PID=$!

          (
            ELAPSED=0
            while kill -0 "$PIGEN_PID" 2>/dev/null; do
              sleep 60
              if kill -0 "$PIGEN_PID" 2>/dev/null; then
                ELAPSED=$((ELAPSED + 60))
                LAST_STEP="$(tail -n 1 work/*/build.log 2>/dev/null || echo 'läuft...')"
                echo "⏱️ [pi-gen] Image-Build läuft (${ELAPSED}s) | Letzter Status: ${LAST_STEP}"
              fi
            done
          ) &
          HB_PID=$!

          if wait "$PIGEN_PID"; then
            RC=0
          else
            RC=$?
          fi
          kill "$HB_PID" 2>/dev/null || true
          wait "$HB_PID" 2>/dev/null || true

          if [[ "$RC" -ne 0 ]]; then
            echo "❌ pi-gen Fehler! Letzte 100 Zeilen aus build.log:"
            tail -n 100 work/*/build.log || true
            exit "$RC"
          fi

          ls -lh deploy/
          cd deploy/
          sha256sum *.img.xz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Image to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${GITHUB_WORKSPACE}/pi-gen/deploy"
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="v$(date -u +%Y.%m.%d-%H%M)"
          fi

          IMG_XZ="$(ls -1 *.img.xz | head -n 1)"
          {
            echo "## 🍓🍃 LMDE 7 ARM64 (\"Gigi\" / Cinnamon Wayland) Image for Raspberry Pi 5, CM5 & Pi 500"
            echo ""
            echo "> **Pure Linux Mint Debian Edition (LMDE 7 \"Gigi\") experience on Raspberry Pi 5 — running 100% pure Wayland.**  "
            echo "> Built upon **Debian 13 (Trixie)**, official **LMDE 7** adjustments, and **Raspberry Pi 5 (BCM2712 / Cortex-A76)** native packages, with zero Xorg server bloat."
            echo "> "
            echo "> *Disclaimer: This is an independent community port by GamingTux and is not affiliated with, sponsored by, or endorsed by the Linux Mint team.*"
            echo ""
            echo "### ✨ Key Release Highlights"
            echo "- **🍃 Pure LMDE 7 Desktop Experience:** Authentic Linux Mint Debian Edition 7 (*Gigi*) desktop with Cinnamon 6.6, official \`debian-system-adjustments\`, official \`mint-logo\` Plymouth boot splash, official Mint wallpapers & Mint-Y themes, Warpinator, Timeshift, Gufw, MintWelcome, MintStick, MintReport, MintBackup, MintLocale, Bulky, Sticky Notes, Thingy, Hypnotix, Celluloid & Drawing."
            echo "- **🪟 100% Xorg-Free Pure Wayland Stack:** Boots directly through a Mint-Y styled Wayland LightDM greeter (\`pi-greeter-labwc\`) into \`cinnamon-wayland\` on VideoCore VII KMS/DRM — with \`xwayland\` seamlessly supporting administrative tools (Timeshift, Synaptic, GParted) and legacy apps."
            echo "- **⚡ Cortex-A76 Native Package Repository:** Desktop, multimedia, and graphics packages natively compiled for **ARMv8.2-A Cortex-A76** (\`crypto + fp16 + dotprod\`)."
            echo "- **🗄️ Btrfs Root Filesystem + Native ZRAM:** Transparent \`compress=zstd:2\` (\`noatime,ssd,discard=async\`) for instant Timeshift snapshots and reduced flash wear, paired with automatic first-boot filesystem expansion and Raspberry Pi OS native ZRAM swap."
            echo "- **🧙 Streamlined 5-Step First-Boot Setup:** Configure keyboard layout, system language & timezone, hostname, Wi-Fi, and user account / autologin on initial boot."
            echo ""
            echo "### 📥 Flashing Instructions"
            echo "1. Download the compressed image \`${IMG_XZ}\`."
            echo "2. Flash directly to an NVMe SSD or MicroSD card using **[Raspberry Pi Imager](https://www.raspberrypi.com/software/)** (*Use Custom*) or **[Balena Etcher](https://etcher.balena.io/)**."
            echo "3. Insert into your Raspberry Pi 5 / CM5 / Pi 500 and power on. The Btrfs root filesystem will automatically resize to fill your drive."
            echo ""
            echo "### 🔐 SHA256 Checksum"
            echo "\`\`\`text"
            cat SHA256SUMS.txt
            echo "\`\`\`"
          } > release_body.md

          git config --global --add safe.directory '*'
          gh release delete "$TAG" -R "${GITHUB_REPOSITORY}" --cleanup-tag -y 2>/dev/null || true

          # 1. Draft-Release anlegen (mit 5x Retry gegen transiente GitHub HTTP 500/502/503 Fehler)
          CREATED=0
          for attempt in 1 2 3 4 5; do
            if gh release create "$TAG" \
              -R "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --draft \
              --title "LMDE 7 ARM64 (Wayland) - Pi 5 & CM5 Btrfs Image ($TAG)" \
              --notes-file release_body.md; then
              CREATED=1
              break
            fi
            echo "⚠️ GitHub API Fehler beim Anlegen des Releases (Versuch ${attempt}/5) – warte $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          [[ "$CREATED" -eq 1 ]] || { echo "❌ Konnte Release nach 5 Versuchen nicht anlegen."; exit 1; }

          # 2. Dateien einzeln mit --clobber und 5x Retry hochladen
          for asset in "$IMG_XZ" SHA256SUMS.txt *.info; do
            [[ -f "$asset" ]] || continue
            UPLOADED=0
            for attempt in 1 2 3 4 5; do
              echo "⬆️ Lade ${asset} hoch (Versuch ${attempt}/5)..."
              if gh release upload "$TAG" "$asset" -R "${GITHUB_REPOSITORY}" --clobber; then
                UPLOADED=1
                break
              fi
              echo "⚠️ Upload-Fehler bei ${asset} (Versuch ${attempt}/5) – warte $((attempt * 15))s..."
              sleep $((attempt * 15))
            done
            [[ "$UPLOADED" -eq 1 ]] || { echo "❌ Konnte ${asset} nach 5 Versuchen nicht hochladen."; exit 1; }
          done

          # 3. Vollständiges Release veröffentlichen
          for attempt in 1 2 3 4 5; do
            if gh release edit "$TAG" -R "${GITHUB_REPOSITORY}" --draft=false --latest; then
              break
            fi
            sleep 10
          done

          # Alte Image-Releases automatisch bereinigen (immer nur die 3 neuesten behalten)
          gh release list -R "${GITHUB_REPOSITORY}" --limit 50 --json tagName --jq '.[3:][].tagName' | while read -r old_tag; do
            [[ -n "$old_tag" ]] || continue
            echo "🧹 Lösche altes Image-Release und Git-Tag: $old_tag"
            gh release delete "$old_tag" -R "${GITHUB_REPOSITORY}" --cleanup-tag -y || true
          done
