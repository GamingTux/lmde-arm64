name: Build Raspberry Pi 5 LMPE Btrfs Image (pi-gen)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (leer lassen für automatisches Datum vYYYY.MM.DD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
      options: --privileged -v /dev:/dev -v /lib/modules:/lib/modules:ro
    defaults:
      run:
        shell: bash
    steps:
      - name: Install pi-gen & Btrfs build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            quilt \
            parted \
            coreutils \
            qemu-user-binfmt \
            debootstrap \
            zerofree \
            zip \
            dosfstools \
            e2fsprogs \
            btrfs-progs \
            libcap2-bin \
            grep \
            rsync \
            xz-utils \
            curl \
            ca-certificates \
            xxd \
            file \
            git \
            kmod \
            bc \
            gpg \
            pigz \
            arch-test \
            fdisk \
            mount \
            util-linux \
            debian-archive-keyring \
            gh

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare loop devices & binfmt
        run: |
          git config --global --add safe.directory '*'
          modprobe loop || true
          modprobe btrfs || true
          for i in $(seq 0 15); do
            mknod -m 660 "/dev/loop${i}" b 7 "${i}" 2>/dev/null || true
          done

      - name: Run pi-gen image build
        run: |
          cd "${GITHUB_WORKSPACE}/pi-gen"
          chmod +x build.sh build-docker.sh
          find stage* export-image -name "*.sh" -exec chmod +x {} +

          ./build.sh &
          PIGEN_PID=$!

          (
            ELAPSED=0
            while kill -0 "$PIGEN_PID" 2>/dev/null; do
              sleep 60
              if kill -0 "$PIGEN_PID" 2>/dev/null; then
                ELAPSED=$((ELAPSED + 60))
                LAST_STEP="$(tail -n 1 work/*/build.log 2>/dev/null || echo 'läuft...')"
                echo "⏱️ [pi-gen] Image-Build läuft (${ELAPSED}s) | Letzter Status: ${LAST_STEP}"
              fi
            done
          ) &
          HB_PID=$!

          if wait "$PIGEN_PID"; then
            RC=0
          else
            RC=$?
          fi
          kill "$HB_PID" 2>/dev/null || true
          wait "$HB_PID" 2>/dev/null || true

          if [[ "$RC" -ne 0 ]]; then
            echo "❌ pi-gen Fehler! Letzte 100 Zeilen aus build.log:"
            tail -n 100 work/*/build.log || true
            exit "$RC"
          fi

          ls -lh deploy/
          cd deploy/
          sha256sum *.img.xz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Image to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${GITHUB_WORKSPACE}/pi-gen/deploy"
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="v$(date -u +%Y.%m.%d-%H%M)"
          fi

          IMG_XZ="$(ls -1 *.img.xz | head -n 1)"
          {
            echo "## 🍓 LMPE ARM64 (LMDE 7 / Cinnamon) Image für Raspberry Pi 5 & Compute Module 5"
            echo "### 🌌 Codename: **Tatooine** ☀️☀️"
            echo ""
            echo "> **Wo jede große Reise beginnt...**  "
            echo "> Angelehnt an die Upstream-Basis Debian 13 (**T**rixie) ist **Tatooine** der offizielle Codename für diese LMPE-Generation. Wie der legendäre Wüstenplanet unter den Zwillingssonnen markiert *Tatooine* den universellen Ausgangspunkt für alle Raspberry Pi 5 & Compute Module 5 Systeme – robust, universell und ab Werk mit kompletter Linux Mint Desktop-Suite ausgestattet."
            echo ""
            echo "### ✨ Highlights dieses Releases"
            echo "- **Volle Linux Mint Desktop-Suite:** Timeshift, MintWelcome, MintStick, MintReport, MintBackup, MintLocale, Bulky, Folder-Color-Switcher, Sticky, Thingy, Hypnotix, Celluloid & Drawing"
            echo "- **System- & Audiowerkzeuge:** GParted, Baobab, Pavucontrol, Seahorse"
            echo "- **Btrfs Root-Dateisystem:** \`defaults,compress=zstd:2,noatime,nodiratime,ssd,discard=async\`, automatischer Online-Resize beim ersten Start & \`/tmp\` im RAM"
            echo "- **Universelle Hardware-Architektur:** Automatische Erkennung für CM5 (DWC2 USB 2.0 Host-Modus für interne Tastatur, Touchpad, Audio & Webcam) bei vollem Standard-Support für Pi 5 Desktop-Boards"
            echo "- **Interaktiver First-Boot-Assistent:** Sprach-, Tastatur-, Hostname-, WLAN- und optionale Argon ONE UP Hardware-Treiber-Auswahl"
            echo "- **Optimierte Paketverwaltung:** Konsolidierte \`/etc/apt/apt.conf.d/99-lmpe.conf\` mit Host-Queues, Pipelining und 3 Retries"
            echo "- **Desktop-Performance:** Cinnamon 6.x mit voller VideoCore VII GPU-Beschleunigung (Mesa 26.2.2 / Glamor) und Cortex-A76 optimiertem Multimedia-Stack"
            echo ""
            echo "### 🔐 SHA256 Checksumme"
            echo "\`\`\`text"
            cat SHA256SUMS.txt
            echo "\`\`\`"
          } > release_body.md

          gh release create "$TAG" \
            "$IMG_XZ" \
            SHA256SUMS.txt \
            *.info \
            --title "LMPE \"Tatooine\" - Pi 5 & CM5 ARM64 Btrfs Image ($TAG)" \
            --notes-file release_body.md

          # Alte Image-Releases automatisch bereinigen (immer nur die 2 neuesten behalten)
          gh release list --limit 50 --json tagName --jq '.[2:][].tagName' | while read -r old_tag; do
            [[ -n "$old_tag" ]] || continue
            echo "🧹 Lösche altes Image-Release und Git-Tag: $old_tag"
            gh release delete "$old_tag" --cleanup-tag -y || true
          done
