name: Build Raspberry Pi 5 LMPE Btrfs Image (pi-gen)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (leer lassen für automatisches Datum vYYYY.MM.DD)'
        required: false
        default: ''
  schedule:
    # Automatisch jeden 1. des Monats um 06:00 UTC ein frisches Image bauen
    - cron: '0 6 1 * *'

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
      options: --privileged -v /dev:/dev -v /lib/modules:/lib/modules:ro
    defaults:
      run:
        shell: bash
    steps:
      - name: Install pi-gen & Btrfs build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            quilt \
            parted \
            coreutils \
            qemu-user-binfmt \
            debootstrap \
            zerofree \
            zip \
            dosfstools \
            e2fsprogs \
            btrfs-progs \
            libcap2-bin \
            grep \
            rsync \
            xz-utils \
            curl \
            ca-certificates \
            xxd \
            file \
            git \
            kmod \
            bc \
            gpg \
            pigz \
            arch-test \
            fdisk \
            mount \
            util-linux \
            debian-archive-keyring \
            gh

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare loop devices & binfmt
        run: |
          git config --global --add safe.directory '*'
          modprobe loop || true
          modprobe btrfs || true
          for i in $(seq 0 15); do
            mknod -m 660 "/dev/loop${i}" b 7 "${i}" 2>/dev/null || true
          done

      - name: Run pi-gen image build
        run: |
          cd "${GITHUB_WORKSPACE}/pi-gen"
          chmod +x build.sh build-docker.sh
          find stage* export-image -name "*.sh" -exec chmod +x {} +

          ./build.sh &
          PIGEN_PID=$!

          (
            ELAPSED=0
            while kill -0 "$PIGEN_PID" 2>/dev/null; do
              sleep 60
              if kill -0 "$PIGEN_PID" 2>/dev/null; then
                ELAPSED=$((ELAPSED + 60))
                LAST_STEP="$(tail -n 1 work/*/build.log 2>/dev/null || echo 'läuft...')"
                echo "⏱️ [pi-gen] Image-Build läuft (${ELAPSED}s) | Letzter Status: ${LAST_STEP}"
              fi
            done
          ) &
          HB_PID=$!

          if wait "$PIGEN_PID"; then
            RC=0
          else
            RC=$?
          fi
          kill "$HB_PID" 2>/dev/null || true
          wait "$HB_PID" 2>/dev/null || true

          if [[ "$RC" -ne 0 ]]; then
            echo "❌ pi-gen Fehler! Letzte 100 Zeilen aus build.log:"
            tail -n 100 work/*/build.log || true
            exit "$RC"
          fi

          ls -lh deploy/
          cd deploy/
          sha256sum *.img.xz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Image to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${GITHUB_WORKSPACE}/pi-gen/deploy"
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="v$(date -u +%Y.%m.%d-%H%M)"
          fi

          IMG_XZ="$(ls -1 *.img.xz | head -n 1)"
          {
            echo "## 🍓 LMPE ARM64 (LMDE 7 / Cinnamon) Image for Raspberry Pi 5 & Compute Module 5"
            echo "### 🌌 Codename: **Tatooine** ☀️☀️"
            echo ""
            echo "> **The journey begins where two suns rise...**  "
            echo "> In tribute to our upstream Debian 13 (**T**rixie) base, **Tatooine** is the official codename for this foundational LMPE generation. Just like the legendary desert world under the twin suns, *Tatooine* marks our universal starting point for all Raspberry Pi 5 and Compute Module 5 systems—rock-solid, universal, and equipped out of the box with the complete Linux Mint desktop suite."
            echo ""
            echo "### ✨ Key Release Highlights"
            echo "- **🍃 Complete Linux Mint Desktop Suite:** Full Cinnamon 6.x desktop environment, Warpinator (local network file sharing), Timeshift, Gufw (firewall), MintWelcome, MintStick, MintReport, MintBackup, MintLocale, Bulky, Folder Color Switcher, Sticky Notes, Thingy, Hypnotix (IPTV), Celluloid & Drawing."
            echo "- **🛠️ Diagnostic & System Tools:** GParted partition manager, Baobab disk analyzer, Btrfs Compsize, Pavucontrol audio manager, Seahorse keyring manager, EarlyOOM freeze protection, Btop & Fastfetch."
            echo "- **🗄️ High-Performance Btrfs Root Filesystem:** Transparent \`compress=zstd:2\`, flash-optimized mount options (\`noatime,nodiratime,ssd,discard=async\`), automatic first-boot partition expansion, and RAM-backed \`/tmp\`."
            echo "- **🧠 Pure ZRAM Compressed Memory:** 4 GB LZ4 compressed swap (\`vm.swappiness = 180\`, \`vm.page-cluster = 0\`) eliminating disk wear and keeping RAM free for Btrfs caches and applications."
            echo "- **⚡ Optimized Storage Schedulers & Rapid Boot:** Direct hardware multi-queue (\`none\`) for NVMe SSDs, \`mq-deadline\` for MicroSD/eMMC, \`bfq\` for rotational USB drives, and FAT32 boot fsck bypass (Pass 0 in fstab saving 300ms)."
            echo "- **🔧 Developer-Ready Kernel:** Pre-configured \`fs.inotify.max_user_watches = 524288\` preventing file watcher limits in IDEs and file managers."
            echo "- **💻 100% Universal Hardware Architecture:** Native DWC2 USB 2.0 host routing for CM5 carrier boards and laptops alongside full support for Raspberry Pi 5 desktop boards."
            echo "- **🎨 Tatooine Signature Art Duo:** Plymouth vector boot splash with twin suns and boot spinner, paired with a distraction-free matching desktop wallpaper."
            echo "- **🧙 Interactive First-Boot Assistant:** Setup language, keyboard layout, hostname, WiFi, and optional Argon ONE UP hardware drivers on initial boot."
            echo "- **🌐 Modern Network & APT Stack:** Consolidated \`/etc/apt/apt.conf.d/99-lmpe.conf\` with host queues, pipelining, 3 retries, and Google TCP BBR congestion control."
            echo ""
            echo "### 📥 Flashing Instructions"
            echo "1. Download the compressed image \`${IMG_XZ}\`."
            echo "2. Flash directly to an NVMe SSD or MicroSD card using **[Raspberry Pi Imager](https://www.raspberrypi.com/software/)** (*Use Custom*) or **[Balena Etcher](https://etcher.balena.io/)**."
            echo "3. Insert into your Raspberry Pi 5 / CM5 and power on. The root filesystem will automatically resize to fill your drive."
            echo ""
            echo "### 🔐 SHA256 Checksum"
            echo "\`\`\`text"
            cat SHA256SUMS.txt
            echo "\`\`\`"
          } > release_body.md

          gh release create "$TAG" \
            "$IMG_XZ" \
            SHA256SUMS.txt \
            *.info \
            --title "LMPE \"Tatooine\" - Pi 5 & CM5 ARM64 Btrfs Image ($TAG)" \
            --notes-file release_body.md

          # Alte Image-Releases automatisch bereinigen (immer nur die 3 neuesten behalten)
          gh release list --limit 50 --json tagName --jq '.[3:][].tagName' | while read -r old_tag; do
            [[ -n "$old_tag" ]] || continue
            echo "🧹 Lösche altes Image-Release und Git-Tag: $old_tag"
            gh release delete "$old_tag" --cleanup-tag -y || true
          done
