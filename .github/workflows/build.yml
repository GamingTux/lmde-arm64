name: Build LMDE 7 (gigi) ARM64 Pi5 Repo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            devscripts \
            equivs \
            apt-utils \
            wget \
            curl \
            gnupg \
            ca-certificates \
            git \
            xz-utils

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure LMDE 7 (gigi) & Debian Trixie APT sources
        run: |
          cat << 'EOF' > /etc/apt/sources.list.d/lmde.list
          deb-src [trusted=yes] http://packages.linuxmint.com gigi main upstream import backport
          deb [arch=amd64 trusted=yes] http://packages.linuxmint.com gigi main upstream import backport
          deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
          deb-src http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
          EOF
          apt-get update

      - name: Fetch existing gh-pages repository for delta builds
        run: |
          if git clone --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" ./repo; then
            rm -rf ./repo/.git
          else
            mkdir -p ./repo
          fi

      - name: Build and sign packages
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          chmod +x ./build-repo.sh
          ./build-repo.sh

      - name: Deploy APT repository to GitHub Pages
        if: always() && hashFiles('repo/dists/gigi/InRelease') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          force_orphan: true

      - name: 60-Day Keep-Alive Commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory '*'
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          KEEPALIVE_DIR="$(mktemp -d)"
          git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$KEEPALIVE_DIR"
          cd "$KEEPALIVE_DIR"
          date -u > .last_sync
          git add .last_sync
          git commit -m "chore: update .last_sync keep-alive" || true
          git push origin HEAD:main
          rm -rf "$KEEPALIVE_DIR"

      - name: Verify overall build status
        if: always()
        run: |
          if [[ "${BUILD_FAILED:-0}" == "1" || -f .build_failed ]]; then
            echo "❌ Mindestens ein Paket konnte nicht gebaut werden (Partial-Deploy nach gh-pages wurde durchgeführt)." >&2
            exit 1
          fi
          echo "✅ Alle Pakete wurden erfolgreich gebaut und veröffentlicht."
