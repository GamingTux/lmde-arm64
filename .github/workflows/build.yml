name: Build LMDE 7 (gigi) ARM64 Pi5 Repo

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Kompletten Neuaufbau aller Pakete erzwingen (ignoriert bisherigen gh-pages Stand)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: build-lmde-arm64-repo
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            devscripts \
            equivs \
            apt-utils \
            wget \
            curl \
            gnupg \
            ca-certificates \
            git \
            jq \
            xz-utils \
            pkgconf \
            cmake \
            python3 \
            libpam0g-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for any earlier running repo build to finish deploying to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUR_RUN_ID="${GITHUB_RUN_ID}"
          while true; do
            ACTIVE_OLDER="$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?status=in_progress" \
              | jq -r --argjson cur "$CUR_RUN_ID" '[.workflow_runs[] | select(.id < $cur) | .id] | length' || echo 0)"
            if [[ "${ACTIVE_OLDER:-0}" -eq 0 ]]; then
              break
            fi
            echo "⏳ Warte auf Abschluss eines älteren laufenden Repo-Builds vor dem Klonen von gh-pages..."
            sleep 30
          done

      - name: Configure Raspberry Pi, LMDE 7 (gigi) & Debian Trixie APT sources
        run: |
          rm -f /etc/apt/sources.list.d/debian.sources
          cat << 'EOF' > /etc/apt/sources.list.d/lmde.list
          deb [trusted=yes] http://archive.raspberrypi.com/debian trixie main
          deb-src [trusted=yes] http://archive.raspberrypi.com/debian trixie main
          deb-src [trusted=yes] http://packages.linuxmint.com gigi main upstream import backport
          deb [arch=amd64 trusted=yes] http://packages.linuxmint.com gigi main upstream import backport
          deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
          deb-src http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          deb-src http://deb.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware
          deb-src http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian trixie-backports main contrib non-free non-free-firmware
          deb-src http://deb.debian.org/debian trixie-backports main contrib non-free non-free-firmware
          EOF
          cat << 'EOF' > /etc/apt/preferences.d/rpi-build.pref
          Package: *
          Pin: origin ""
          Pin-Priority: 995

          Package: *
          Pin: origin "archive.raspberrypi.com"
          Pin-Priority: 990
          EOF
          apt-get update

      - name: Fetch existing gh-pages repository for delta builds
        run: |
          if [[ "${{ inputs.force_rebuild }}" == "true" ]]; then
            echo "🔄 Force-Rebuild aktiv: Starte sauberen Neuaufbau ohne bisherigen Paket-Pool..."
            mkdir -p ./repo
          elif git clone --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" ./repo; then
            rm -rf ./repo/.git
          else
            mkdir -p ./repo
          fi

      - name: Build and sign packages
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          chmod +x ./build-repo.sh
          ./build-repo.sh

      - name: Ensure repository web catalog index.html exists
        if: always() && hashFiles('repo/dists/gigi/InRelease') != ''
        run: |
          if [[ -f "./generate-repo-index.py" ]]; then
            python3 ./generate-repo-index.py ./repo || true
          fi

      - name: Deploy APT repository to GitHub Pages
        if: always() && hashFiles('repo/dists/gigi/InRelease') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          force_orphan: true

      - name: 60-Day Keep-Alive Commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory '*'
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          KEEPALIVE_DIR="$(mktemp -d)"
          git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$KEEPALIVE_DIR"
          cd "$KEEPALIVE_DIR"
          date -u > .last_sync
          git add .last_sync
          git commit -m "chore: update .last_sync keep-alive" || true
          git push origin HEAD:main
          rm -rf "$KEEPALIVE_DIR"

      - name: Trigger continuation run if time budget was reached
        if: always() && env.TIME_LIMIT_REACHED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Zeitbudget im aktuellen Lauf erreicht – starte automatisch Folge-Lauf für verbleibende Pakete..."
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Verify overall build status
        if: always()
        run: |
          if [[ "${BUILD_FAILED:-0}" == "1" || -f .build_failed ]]; then
            echo "❌ Mindestens ein Paket konnte nicht gebaut werden (Partial-Deploy nach gh-pages wurde durchgeführt)." >&2
            exit 1
          fi
          echo "✅ Alle Pakete wurden erfolgreich gebaut und veröffentlicht."
